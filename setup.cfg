[metadata]
name = kappalens
version = 0.2.0
description = Auditable lattice and electronic transport analysis
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/Zhaoyihang-PRC/KappaLens
project_urls =
    Issues = https://github.com/Zhaoyihang-PRC/KappaLens/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Physics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.20

[options.packages.find]
where = src

[options.extras_require]
phonons =
    h5py>=3.8
spectra =
    scipy>=1.6
dynasor =
    scipy>=1.6
    dynasor
demo =
    h5py>=3.8
    scipy>=1.6
all =
    h5py>=3.8
    scipy>=1.6
    dynasor

[options.entry_points]
console_scripts =
    kappalens = kappalens.cli:main
